name: CI

# Straight-to-main delivery: run on every push to main, not only on PRs
# (PAS-OPS-004; proappstore-online/platform#204).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Runner routing (see CLAUDE.md "CI runner rules"). Public repo: the router job
  # and every job below run on ubuntu-latest; no billing check, no secret read.
  # Private repo: GitHub-hosted while included minutes remain, self-hosted pags
  # once they are spent, using the repo-level RUNNER_BILLING_TOKEN (never an org
  # secret). No job sets its own runner label.
  router:
    uses: ProAgentStore/runner-router/.github/workflows/router.yml@v1
    with:
      included-minutes: 2000
      self-hosted-labels: self-hosted,pags
    secrets:
      billing-token: ${{ secrets.RUNNER_BILLING_TOKEN }}

  typecheck:
    needs: router
    runs-on: ${{ fromJSON(needs.router.outputs.runner) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Check public snapshot privacy and commit metadata
        run: python3 scripts/check-public-snapshot.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    needs: router
    runs-on: ${{ fromJSON(needs.router.outputs.runner) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Python unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Vitest (rendered UI regression)
        run: pnpm --filter @tennis-clubs/web exec vitest run
      # Query budgets run in the Python unit tests above (tests/test_performance_budgets.py).
      - name: Web bundle build (performance budget input)
        run: pnpm --filter @tennis-clubs/web build
      - name: Bundle size budget
        run: python3 scripts/check-bundle-budget.py
